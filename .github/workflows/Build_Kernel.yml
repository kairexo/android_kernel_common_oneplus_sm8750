name: Build OnePlus Ace 6 Kernel

on:
  workflow_dispatch:
    inputs:
      SUFFIX:
        type: string
        description: "自定义内核后缀(不输入使用随机字符串)"
        required: false
        default: ""
      BUILD_TIME:
        type: string
        description: "自定义构建时间(输入F使用当前UTC时间)"
        required: false
        default: "Mon Aug 18 09:30:24 UTC 2025"
      FAST_BUILD:
        type: boolean
        description: "是否启用极速构建？"
        required: true
        default: true
      LSM:
        type: boolean
        description: "是否启用基带保护模块(BBG)？"
        required: true
        default: true
      SCHED:
        type: boolean
        description: "是否添加风驰调度器？"
        required: true
        default: true
      NETFILTER:
        type: boolean
        description: "是否启用IPv6 NAT修复？"
        required: true
        default: true
      HymoFS:
        type: boolean
        description: "是否启用HymoFS？"
        required: true
        default: true

jobs:
  build:
    name: Build Kernel for OnePlus Ace 6${{ github.event.inputs.LSM == 'true' && ' [LSM]' || '' }}${{ github.event.inputs.SCHED == 'true' && ' [SCHED]' || '' }} ${{ github.event.inputs.SUFFIX }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
      FILE: oneplus_ace_6
      CPU: sm8750
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Check Disk Space
        run: df -h

      - name: Create and Enable 3G Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install Dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest 
        with: 
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix bc
          execute_install_scripts: true

      - name: Download ZyCromerZ Clang
        run: |
          mkdir -p clang
          cd clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/18.0.0git-20240124-release/Clang-18.0.0git-20240124.tar.gz
          tar -xzf Clang-18.0.0git-20240124.tar.gz
          rm Clang-18.0.0git-20240124.tar.gz
          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_ENV

      - name: Clone Repo  
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          git clone https://github.com/TheGeniusClub/android_kernel_common_oneplus_sm8750.git -b v14 --depth=1 .

      - name: Extract Kernel Version Info
        run: |
          cd kernel_workspace
          # 从 Makefile 获取内核版本
          VERSION=$(awk '/^VERSION =/ {print $3}' Makefile)
          PATCHLEVEL=$(awk '/^PATCHLEVEL =/ {print $3}' Makefile)
          SUBLEVEL=$(awk '/^SUBLEVEL =/ {print $3}' Makefile)
          KERNEL_VERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}"
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          
          # 检测 Android 版本
          if [ -f "build.config.constants" ]; then
            BRANCH=$(grep -m1 '^BRANCH=' build.config.constants | cut -d= -f2)
            ANDROID_VERSION=${BRANCH%-*}
            echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
          fi

      - name: Custom Kernel Suffix
        run: |
          cd kernel_workspace
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          
          # 如果未提供后缀，生成随机后缀
          if [ -z "$SUFFIX" ]; then
            RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
            RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
            SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"
            echo "Generated random suffix: $SUFFIX"
          fi
          
          echo "KERNEL_SUFFIX=$SUFFIX" >> $GITHUB_ENV
          
          # 修改 setlocalversion 脚本
          for path in scripts/setlocalversion; do
            [ -f "$path" ] || continue
            echo "Modifying: $path"
            
            # 移除 -dirty 标记
            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"
            
            # 添加自定义后缀
            if grep -q 'echo "\$res"' "$path"; then
              if [ "${{ github.event.inputs.FAST_BUILD }}" = "true" ]; then
                sed -i "s/^res=.*/res=\"-${SUFFIX}\"/" "$path"
              else
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp" && mv "$path.tmp" "$path"
              fi
            fi
            chmod +x "$path"
          done
          
          git add -A
          git commit -m "Add custom kernel suffix: $SUFFIX" || true

      - name: Apply HMBIRD Patch (OGKI to GKI)
        run: |
          cd kernel_workspace
          
          # 检查是否已存在风驰代码
          for p in kernel/sched/hmbird* vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && {
              echo "风驰代码已存在，跳过 HMBIRD 补丁"
              exit 0
            }
          done
          
          # 下载补丁
          wget -O hmbird_patch.patch https://raw.githubusercontent.com/Numbersf/Action-Build/main/patches/hmbird_patch.patch
          
          # 应用补丁
          sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          echo "正在打 HMBIRD OGKI转GKI 补丁..."
          patch -p1 -F 3 < hmbird_patch.patch || true
          echo "HMBIRD patch 完成"

      - name: Apply SCHED Patch (风驰调度器)
        if: ${{ github.event.inputs.SCHED == 'true' }}
        run: |
          cd kernel_workspace
          
          # 克隆风驰补丁仓库
          git clone https://github.com/Numbersf/SCHED_PATCH.git -b ${{ env.CPU }} || {
            echo "❌ CPU 分支不存在，风驰内核暂未支持此机型"
            exit 1
          }
          
          echo "正在拉取风驰补丁..."
          PATCH_FILE="fengchi_${{ env.FILE }}.patch"
          
          if [[ -f "SCHED_PATCH/$PATCH_FILE" ]]; then
            cp "SCHED_PATCH/$PATCH_FILE" ./
            dos2unix "$PATCH_FILE"
            echo "正在打风驰补丁..."
            patch -p1 -F 3 < "$PATCH_FILE" || true
            echo "风驰 patch 完成"
          else
            echo "❌ 未找到对应补丁文件，风驰内核暂未支持此机型"
            exit 1
          fi

      - name: Apply LSM_BBG (基带保护)
        if: ${{ github.event.inputs.LSM == 'true' }}
        run: |
          cd kernel_workspace
          echo "正在启用内核级基带保护支持..."
          curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/lockdown/lockdown,baseband_guard/ } }' ./security/Kconfig
          echo "LSM BBG 补丁完成"

      - name: Apply IPv6 NAT Fix
        if: ${{ github.event.inputs.NETFILTER == 'true' }}
        run: |
          cd kernel_workspace
          echo "正在修复 IPv6 NAT 问题..."
          wget -O IPv6_NAT_FIX.patch https://raw.githubusercontent.com/Numbersf/Action-Build/main/patches/IPv6_NAT_FIX.patch
          patch -p1 -F 3 < IPv6_NAT_FIX.patch || true
          echo "IPv6 NAT Fix 完成"

      - name: Apply HymoFS
        if: ${{ github.event.inputs.HymoFS == 'true' }}
        run: |
          cd kernel_workspace
          echo "正在添加 HymoFS ..."
          wget -O hymofs.patch https://raw.githubusercontent.com/Anatdx/HymoFS/refs/heads/main/patch/hymofs.patch
          patch -p1 -F 3 < hymofs.patch || true
          echo "添加 HymoFS 完成"

      - name: Configure Kernel
        run: |
          cd kernel_workspace
          CONFIG_FILE=./arch/arm64/configs/gki_defconfig
          
          # 基础配置
          echo "CONFIG_LOCALVERSION=\"-${{ env.KERNEL_SUFFIX }}\"" >> "$CONFIG_FILE"
          
          # LSM 配置
          if [ "${{ github.event.inputs.LSM }}" = "true" ]; then
            echo "CONFIG_BBG=y" >> "$CONFIG_FILE"
          fi
          
          # IPv6 NAT 配置
          if [ "${{ github.event.inputs.NETFILTER }}" = "true" ]; then
            cat >> "$CONFIG_FILE" <<EOF
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          EOF
          fi

          # HymoFS 配置
          if [ "${{ github.event.inputs.HymoFS }}" = "true" ]; then
            echo "CONFIG_HYMOFS=y" >> "$CONFIG_FILE"
          fi
          
          # 移除构建审查
          sed -i 's/check_defconfig//' ./build.config.gki 2>/dev/null || true

      - name: Custom BUILD_TIME
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using custom BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using UTC time: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          
          cd kernel_workspace
          for f in scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              fi
            fi
          done

      - name: Build Kernel with ZyCromerZ Clang
        run: |
          cd kernel_workspace
          
          export PATH="${{ env.CLANG_PATH }}:$PATH"
          export KBUILD_BUILD_USER="GitHub-Actions"
          export KBUILD_BUILD_HOST="GitHub"
          
          # 配置编译参数
          MAKE_ARGS="
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc --all)
          "
          
          # 生成配置
          make O=out $MAKE_ARGS gki_defconfig
          
          # 编译内核
          make O=out $MAKE_ARGS 2>&1 | tee build.log
          
          # 检查编译结果
          if [ ! -f "out/arch/arm64/boot/Image" ]; then
            echo "❌ 内核编译失败"
            exit 1
          fi
          
          echo "✅ 内核编译成功"

      - name: Make AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          
          # 复制内核镜像
          cp kernel_workspace/out/arch/arm64/boot/Image ./AnyKernel3/
          
          # 修改 AnyKernel3 配置
          cd AnyKernel3
          cat > anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers
          
          ## AnyKernel setup
          # begin properties
          properties() { '
          kernel.string=OnePlus 6.6 Kernel | Build by KaiRex
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          '; } # end properties
          
          ### AnyKernel install
          
          ## boot shell variables
          block=boot
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          # is recovery
          if ! pgrep zygote >/dev/null; then
              abort "! Recovery installation not supported"
          fi

          . tools/ak3-core.sh

          ui_print " " "  -> Flashing Kernel..."

          ## cmd output
          print_output() {
              IFS=$'\n'
              eval "$1" | while read line; do
                  ui_print "${line}"
              done
          }

          # boot install
          split_boot
          flash_boot
          ## end boot install
          EOF
          
          chmod +x anykernel.sh

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_OnePlus_Ace6_${{ env.KERNEL_VERSION }}${{ github.event.inputs.LSM == 'true' && '_LSM' || '' }}${{ github.event.inputs.SCHED == 'true' && '_SCHED' || '' }}_${{ env.KERNEL_SUFFIX }}
          path: ./AnyKernel3/*

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: kernel_workspace/build.log

      - name: Post-build Disk Check
        run: df -h
